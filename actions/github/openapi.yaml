openapi: 3.1.0
info:
  title: Software Engineering Method GPT - GitHub Action
  description: Bounded GitHub REST and Projects v2 GraphQL Tool Capability exposed to the Software Engineering Method GPT.
    Supports repository discovery/creation, branches, files, issues, pull requests, native Sub-issues, organization Issue
    Field metadata, and an explicit allowlist of Projects v2 operations. Destructive repository operations, pull-request merge,
    and arbitrary GraphQL are not exposed. Tool Capability != Role Authority.
  version: 2.1.0
servers:
- url: https://api.github.com
  description: GitHub API
paths:
  /user:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated GitHub user
      responses:
        '200':
          description: Authenticated GitHub user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
  /user/repos:
    get:
      operationId: listRepositories
      summary: List repositories accessible to the authenticated user
      parameters:
      - name: visibility
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - public
          - private
          default: all
      - name: affiliation
        in: query
        required: false
        schema:
          type: string
          default: owner,collaborator,organization_member
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created
          - updated
          - pushed
          - full_name
          default: updated
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Repositories accessible to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
        '401':
          description: Authentication required
    post:
      operationId: createRepository
      summary: Create a repository for the authenticated user
      description: Create a repository. This is a structural mutation; tool availability does not imply workflow authorization.
        Repository deletion is intentionally not exposed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '201':
          description: Repository created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '422':
          description: Validation failed or secondary rate limit
  /repos/{owner}/{repo}:
    get:
      operationId: getRepository
      summary: Get repository information
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      responses:
        '200':
          description: Repository information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '404':
          description: Repository not found or inaccessible
  /repos/{owner}/{repo}/contents:
    get:
      operationId: getRepositoryRoot
      summary: List the root directory of a repository
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: ref
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Repository root contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentEntry'
        '404':
          description: Repository or reference not found
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: getRepositoryContent
      summary: Read a repository file or list a directory
      description: Read a file or list a directory. File content is normally Base64 encoded. Use ref to select the branch,
        tag, or commit to inspect.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: ref
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: File or directory contents
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FileContent'
                - type: array
                  items:
                    $ref: '#/components/schemas/ContentEntry'
        '404':
          description: File, directory, repository, or reference not found
    put:
      operationId: createOrUpdateRepositoryFile
      summary: Create or update a file on an explicit branch
      description: Create or replace a file on an explicit branch. Content must be Base64 encoded. When updating a file, provide
        its current blob SHA.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
                content:
                  type: string
                  minLength: 1
                sha:
                  type: string
                branch:
                  type: string
                  minLength: 1
              required:
              - message
              - content
              - branch
      responses:
        '200':
          description: File updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentMutationResult'
        '201':
          description: File created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentMutationResult'
        '404':
          description: Repository, branch, or file not found
        '409':
          description: Conflict, typically stale SHA or concurrent update
        '422':
          description: Validation failed
  /repos/{owner}/{repo}/git/ref/{ref}:
    get:
      operationId: getGitReference
      summary: Get a Git branch or tag reference
      description: For a branch, use heads/<branch>. The returned object.sha can be used as the base commit when creating
        another branch.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: ref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Git reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitReference'
        '404':
          description: Reference not found
        '409':
          description: Conflict
  /repos/{owner}/{repo}/git/refs:
    post:
      operationId: createGitReference
      summary: Create a Git branch reference
      description: Create a branch reference from an existing commit SHA. The ref is restricted to refs/heads/* and cannot
        create tags.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref:
                  type: string
                  pattern: ^refs/heads/.+
                sha:
                  type: string
                  minLength: 40
                  maxLength: 64
              required:
              - ref
              - sha
      responses:
        '201':
          description: Reference created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitReference'
        '409':
          description: Conflict
        '422':
          description: Validation failed or reference already exists
  /repos/{owner}/{repo}/issues:
    get:
      operationId: listIssues
      summary: List repository issues
      description: GitHub's Issues API may also return pull requests. Entries containing pull_request represent pull requests.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - closed
          - all
          default: open
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created
          - updated
          - comments
          default: created
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Repository issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '404':
          description: Repository not found or inaccessible
    post:
      operationId: createIssue
      summary: Create a repository issue
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                body:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                assignees:
                  type: array
                  items:
                    type: string
                milestone:
                  type: integer
              required:
              - title
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '403':
          description: Forbidden
        '410':
          description: Issues are disabled for the repository
        '422':
          description: Validation failed or secondary rate limit
  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      operationId: getIssue
      summary: Get a specific issue
      description: The returned node_id can be used directly as a Projects v2 contentId.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '404':
          description: Issue or repository not found
    patch:
      operationId: updateIssue
      summary: Update an issue or its workflow metadata
      description: Update issue content or workflow metadata. Do not silently change authoritative product requirements without
        user authorization.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                body:
                  type: string
                state:
                  type: string
                  enum:
                  - open
                  - closed
                state_reason:
                  type: string
                  enum:
                  - completed
                  - not_planned
                  - reopened
                labels:
                  type: array
                  items:
                    type: string
                assignees:
                  type: array
                  items:
                    type: string
                milestone:
                  type: integer
      responses:
        '200':
          description: Issue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '403':
          description: Forbidden
        '404':
          description: Issue or repository not found
        '422':
          description: Validation failed
  /repos/{owner}/{repo}/issues/{issue_number}/parent:
    get:
      operationId: getParentIssue
      summary: Get the parent issue of a sub-issue
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Parent issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '404':
          description: Issue or parent not found
        '410':
          description: Gone
  /repos/{owner}/{repo}/issues/{issue_number}/sub_issues:
    get:
      operationId: listSubIssues
      summary: List sub-issues of an issue
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Sub-issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '404':
          description: Issue or repository not found
    post:
      operationId: addSubIssue
      summary: Add a sub-issue relation
      description: Use GitHub native sub-issue relationships. Do not simulate this by writing Project fields.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubIssueRequest'
      responses:
        '201':
          description: Sub-issue added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '403':
          description: Forbidden
        '404':
          description: Issue or repository not found
        '410':
          description: Gone
        '422':
          description: Validation failed or secondary rate limit
  /repos/{owner}/{repo}/issues/{issue_number}/sub_issue:
    delete:
      operationId: removeSubIssue
      summary: Remove a sub-issue relation
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: issue_number
        in: path
        required: true
        description: Issue number.
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveSubIssueRequest'
      responses:
        '200':
          description: Sub-issue relation removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          description: Bad request
        '404':
          description: Issue or repository not found
  /repos/{owner}/{repo}/pulls:
    get:
      operationId: listPullRequests
      summary: List repository pull requests
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - closed
          - all
          default: open
      - name: head
        in: query
        required: false
        schema:
          type: string
      - name: base
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created
          - updated
          - popularity
          - long-running
          default: created
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Repository pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequest'
        '404':
          description: Repository not found or inaccessible
    post:
      operationId: createPullRequest
      summary: Create a pull request
      description: Open a PR from head into base. Prefer draft=true until implementation and validation are ready for human
        review. Merge is not exposed.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                head:
                  type: string
                  minLength: 1
                base:
                  type: string
                  minLength: 1
                body:
                  type: string
                draft:
                  type: boolean
                  default: true
                maintainer_can_modify:
                  type: boolean
                  default: true
              required:
              - title
              - head
              - base
      responses:
        '201':
          description: Pull request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
        '403':
          description: Forbidden
        '422':
          description: Validation failed or secondary rate limit
  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      operationId: getPullRequest
      summary: Get a specific pull request
      description: The returned node_id can be used directly as a Projects v2 contentId.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: pull_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Pull request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
        '404':
          description: Pull request or repository not found
    patch:
      operationId: updatePullRequest
      summary: Update a pull request
      description: Update pull request metadata or state. Merge is not exposed. Close a pull request only when explicitly
        authorized.
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: pull_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                body:
                  type: string
                state:
                  type: string
                  enum:
                  - open
                  - closed
                base:
                  type: string
                maintainer_can_modify:
                  type: boolean
      responses:
        '200':
          description: Pull request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequest'
        '403':
          description: Forbidden
        '422':
          description: Validation failed
  /repos/{owner}/{repo}/pulls/{pull_number}/files:
    get:
      operationId: getPullRequestFiles
      summary: List files changed by a pull request
      parameters:
      - name: owner
        in: path
        required: true
        description: GitHub username or organization.
        schema:
          type: string
      - name: repo
        in: path
        required: true
        description: Repository name without .git.
        schema:
          type: string
      - name: pull_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Files changed by the pull request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PullRequestFile'
        '404':
          description: Pull request or repository not found
  /orgs/{org}/issue-fields:
    get:
      operationId: listOrganizationIssueFields
      summary: List organization issue fields and their options
      description: Read-only metadata for organization-level Issue Fields. Kept separate from Projects v2 custom fields.
      parameters:
      - name: org
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Organization issue fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationIssueField'
        '403':
          description: Forbidden
        '404':
          description: Organization not found or feature inaccessible
  /graphql:
    post:
      operationId: executeAllowedProjectV2Operation
      summary: Execute an allowlisted GitHub Projects v2 operation
      description: Execute one predefined Projects v2 GraphQL query or mutation. Arbitrary GraphQL is intentionally not exposed.
        Tool capability does not by itself grant role authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '401':
          description: Authentication or permission error
        '403':
          description: Forbidden
components:
  schemas:
    User:
      type: object
      additionalProperties: true
      properties:
        login:
          type: string
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        html_url:
          type: string
        avatar_url:
          type: string
    Repository:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        node_id:
          type: string
        name:
          type: string
        full_name:
          type: string
        private:
          type: boolean
        description:
          type:
          - string
          - 'null'
        default_branch:
          type: string
        html_url:
          type: string
        language:
          type:
          - string
          - 'null'
        updated_at:
          type: string
        pushed_at:
          type:
          - string
          - 'null'
    ContentEntry:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        name:
          type: string
        path:
          type: string
        sha:
          type: string
        size:
