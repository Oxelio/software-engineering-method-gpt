    GraphQLRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: Exact allowlisted GitHub GraphQL operation.
          enum:
          - query($login:String!,$number:Int!){organization(login:$login){projectV2(number:$number){id title}}}
          - query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id title}}}
          - query($projectId:ID!){node(id:$projectId){... on ProjectV2{fields(first:100){nodes{... on ProjectV2FieldCommon{id
            name} ... on ProjectV2SingleSelectField{id name options{id name}} ... on ProjectV2IterationField{id name configuration{iterations{startDate
            id}}}}}}}}
          - mutation($projectId:ID!,$contentId:ID!){addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){item{id}}}
          - mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$text:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{text:$text}}){projectV2Item{id}}}
          - mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){projectV2Item{id}}}
          - mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$iterationId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{iterationId:$iterationId}}){projectV2Item{id}}}
          - query($login:String!,$first:Int!,$after:String,$search:String){organization(login:$login){projectsV2(first:$first,after:$after,query:$search){nodes{id
            number title shortDescription closed public url owner{... on Organization{login} ... on User{login}}}pageInfo{hasNextPage
            endCursor}totalCount}}}
          - query($login:String!,$first:Int!,$after:String,$search:String){user(login:$login){projectsV2(first:$first,after:$after,query:$search){nodes{id
            number title shortDescription closed public url owner{... on Organization{login} ... on User{login}}}pageInfo{hasNextPage
            endCursor}totalCount}}}
          - query($projectId:ID!,$first:Int!,$after:String){node(id:$projectId){... on ProjectV2{fields(first:$first,after:$after,orderBy:{field:POSITION,direction:ASC}){nodes{__typename
            ... on ProjectV2FieldCommon{id name dataType} ... on ProjectV2SingleSelectField{options{id name description color}}
            ... on ProjectV2MultiSelectField{multiSelectOptions{id name description color}} ... on ProjectV2IterationField{configuration{duration
            startDay iterations{id title startDate duration} completedIterations{id title startDate duration}}}}pageInfo{hasNextPage
            endCursor}totalCount}}}}
          - query($projectId:ID!,$first:Int!,$after:String){node(id:$projectId){... on ProjectV2{items(first:$first,after:$after){nodes{id
            type isArchived content{... on Issue{id number title state url repository{nameWithOwner}} ... on PullRequest{id
            number title state url repository{nameWithOwner}} ... on DraftIssue{id title body}} fieldValues(first:100){nodes{__typename
            ... on ProjectV2ItemFieldTextValue{field{... on ProjectV2FieldCommon{id name dataType}} text} ... on ProjectV2ItemFieldNumberValue{field{...
            on ProjectV2FieldCommon{id name dataType}} number} ... on ProjectV2ItemFieldDateValue{field{... on ProjectV2FieldCommon{id
            name dataType}} date} ... on ProjectV2ItemFieldSingleSelectValue{field{... on ProjectV2FieldCommon{id name dataType}}
            optionId name color description} ... on ProjectV2ItemFieldMultiSelectValue{field{... on ProjectV2FieldCommon{id
            name dataType}} value options{id name description color}} ... on ProjectV2ItemFieldIterationValue{field{... on
            ProjectV2FieldCommon{id name dataType}} iterationId title startDate duration} ... on ProjectV2ItemFieldLabelValue{field{...
            on ProjectV2FieldCommon{id name dataType}} labels(first:100){nodes{id name}}} ... on ProjectV2ItemFieldMilestoneValue{field{...
            on ProjectV2FieldCommon{id name dataType}} milestone{id number title}} ... on ProjectV2ItemFieldRepositoryValue{field{...
            on ProjectV2FieldCommon{id name dataType}} repository{id nameWithOwner}} ... on ProjectV2ItemFieldUserValue{field{...
            on ProjectV2FieldCommon{id name dataType}} users(first:100){nodes{id login}}} ... on ProjectV2ItemFieldPullRequestValue{field{...
            on ProjectV2FieldCommon{id name dataType}} pullRequests(first:100){nodes{id number title url}}} ... on ProjectV2ItemIssueFieldValue{field{...
            on ProjectV2FieldCommon{id name dataType}} issueFieldValue{__typename ... on IssueFieldDateValue{value} ... on
            IssueFieldMultiSelectValue{value options{id name color description}} ... on IssueFieldNumberValue{value} ... on
            IssueFieldSingleSelectValue{optionId name value color description} ... on IssueFieldTextValue{value}}}}}}pageInfo{hasNextPage
            endCursor}totalCount}}}}
          - query($itemId:ID!,$first:Int!,$after:String){node(id:$itemId){... on ProjectV2Item{fieldValues(first:$first,after:$after){nodes{__typename
            ... on ProjectV2ItemFieldTextValue{field{... on ProjectV2FieldCommon{id name dataType}} text} ... on ProjectV2ItemFieldNumberValue{field{...
            on ProjectV2FieldCommon{id name dataType}} number} ... on ProjectV2ItemFieldDateValue{field{... on ProjectV2FieldCommon{id
            name dataType}} date} ... on ProjectV2ItemFieldSingleSelectValue{field{... on ProjectV2FieldCommon{id name dataType}}
            optionId name color description} ... on ProjectV2ItemFieldMultiSelectValue{field{... on ProjectV2FieldCommon{id
            name dataType}} value options{id name description color}} ... on ProjectV2ItemFieldIterationValue{field{... on
            ProjectV2FieldCommon{id name dataType}} iterationId title startDate duration} ... on ProjectV2ItemFieldLabelValue{field{...
            on ProjectV2FieldCommon{id name dataType}} labels(first:100){nodes{id name}}} ... on ProjectV2ItemFieldMilestoneValue{field{...
            on ProjectV2FieldCommon{id name dataType}} milestone{id number title}} ... on ProjectV2ItemFieldRepositoryValue{field{...
            on ProjectV2FieldCommon{id name dataType}} repository{id nameWithOwner}} ... on ProjectV2ItemFieldUserValue{field{...
            on ProjectV2FieldCommon{id name dataType}} users(first:100){nodes{id login}}} ... on ProjectV2ItemFieldPullRequestValue{field{...
            on ProjectV2FieldCommon{id name dataType}} pullRequests(first:100){nodes{id number title url}}} ... on ProjectV2ItemIssueFieldValue{field{...
            on ProjectV2FieldCommon{id name dataType}} issueFieldValue{__typename ... on IssueFieldDateValue{value} ... on
            IssueFieldMultiSelectValue{value options{id name color description}} ... on IssueFieldNumberValue{value} ... on
            IssueFieldSingleSelectValue{optionId name value color description} ... on IssueFieldTextValue{value}}}}pageInfo{hasNextPage
            endCursor}totalCount}}}}
          - mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$value:ProjectV2FieldValue!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:$value}){projectV2Item{id}}}
          - mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!){clearProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId}){projectV2Item{id}}}
          - mutation($projectId:ID!,$itemId:ID!){deleteProjectV2Item(input:{projectId:$projectId,itemId:$itemId}){deletedItemId}}
          - mutation($projectId:ID!,$name:String!,$dataType:ProjectV2CustomFieldType!,$singleSelectOptions:[ProjectV2SingleSelectFieldOptionInput!],$multiSelectOptions:[ProjectV2MultiSelectFieldOptionInput!],$iterationConfiguration:ProjectV2IterationFieldConfigurationInput){createProjectV2Field(input:{projectId:$projectId,name:$name,dataType:$dataType,singleSelectOptions:$singleSelectOptions,multiSelectOptions:$multiSelectOptions,iterationConfiguration:$iterationConfiguration}){projectV2Field{__typename
            ... on ProjectV2FieldCommon{id name dataType} ... on ProjectV2SingleSelectField{options{id name description color}}
            ... on ProjectV2MultiSelectField{multiSelectOptions{id name description color}} ... on ProjectV2IterationField{configuration{duration
            startDay iterations{id title startDate duration}}}}}}
          - mutation($fieldId:ID!){deleteProjectV2Field(input:{fieldId:$fieldId}){projectV2Field{__typename ... on ProjectV2FieldCommon{id
            name dataType}}}}
          - query($projectId:ID!,$first:Int!,$after:String){node(id:$projectId){... on ProjectV2{views(first:$first,after:$after){nodes{id
            number name layout filter configuration{visibleFields(first:100){nodes{... on ProjectV2FieldCommon{id name dataType}}}}}pageInfo{hasNextPage
            endCursor}totalCount}}}}
        variables:
          $ref: '#/components/schemas/GraphQLVariables'
      required:
      - query
      - variables
    GraphQLError:
      type: object
