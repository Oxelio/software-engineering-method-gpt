name: Governance validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  manifest-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/validate_manifest_shape.py

  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern" || {
            echo "PR title is not a Conventional Commit header: $PR_TITLE"
            exit 1
          }
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failed=0
          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "Non-conventional commit subject: $subject"
              failed=1
            fi
          done < <(git log --format='%s' "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
