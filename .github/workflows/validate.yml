name: Validate OpenAPI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate OpenAPI specification
        run: >
          npx --yes @redocly/cli@2.45.0
          lint actions/github/openapi.yaml
          --extends=spec
          --format=github-actions